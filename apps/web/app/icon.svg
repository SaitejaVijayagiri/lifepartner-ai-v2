<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#4F46E5"/> <!-- Indigo-600 -->
            <stop offset="100%" stop-color="#312E81"/> <!-- Indigo-900 -->
        </linearGradient>
        <linearGradient id="goldGradient" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FCD34D"/> <!-- Amber-300 -->
            <stop offset="100%" stop-color="#D97706"/> <!-- Amber-600 -->
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="15" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Background Circle -->
    <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
    
    <!-- Stylized Infinity Heart Knot -->
    <path d="M256 120C190 120 150 160 150 210C150 260 200 300 256 350C312 300 362 260 362 210C362 160 322 120 256 120ZM256 380C190 320 130 270 130 210C130 145 180 100 256 100C332 100 382 145 382 210C382 270 322 320 256 380Z" fill="url(#goldGradient)" filter="url(#glow)"/>
    
    <!-- Inner Knot/Loop embellishment -->
    <path d="M256 160C230 160 210 180 210 210C210 240 256 280 256 280C256 280 302 240 302 210C302 180 282 160 256 160Z" fill="#FFF" opacity="0.3"/>
</svg>
