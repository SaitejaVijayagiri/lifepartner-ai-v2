# Cloud Build + Cloud Run deployment pipeline for LifePartner AI Backend
# Connects directly in Google Cloud Build -> Triggers or run manually via:
#   gcloud builds submit --config cloudbuild.yaml .
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lifepartner-backend:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lifepartner-backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - './backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lifepartner-backend:$SHORT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lifepartner-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lifepartner-backend:$SHORT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--cpu'
      - '1'
      - '--memory'
      - '1Gi'
      - '--cpu-boost'
      - '--session-affinity'
      - '--concurrency'
      - '100'
      - '--timeout'
      - '300'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '50'

images:
  - 'gcr.io/$PROJECT_ID/lifepartner-backend:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/lifepartner-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
